[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelchair-imu-angular-profiling"
version = "1.1.1"
description = "Public, reproducible signal-processing pipeline for wheelchair IMU angular profiling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.scripts]
wheelchair-pipeline = "wheelchair_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
