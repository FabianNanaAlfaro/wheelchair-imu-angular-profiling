name: CI

on:
  push:
  pull_request:

jobs:
  public-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demo
        run: python scripts/run_public_demo.py
      - name: Reproduce manuscript summaries
        run: python scripts/reproduce_manuscript_outputs.py --check
      - name: Generate manuscript figures
        run: python scripts/generate_manuscript_figures.py --check --publish-assets
      - name: Audit public release
        run: python scripts/audit_public_release.py
