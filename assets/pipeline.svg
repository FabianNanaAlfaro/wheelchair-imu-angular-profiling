<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Wheelchair IMU angular profiling public pipeline</title>
  <desc id="desc">Protocol acquisition, signal conditioning, angular descriptor calculation, phase normalization, and reproducible outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071827"/><stop offset="1" stop-color="#123b55"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#123b55"/><stop offset="1" stop-color="#1c5874"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#03111c" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3c7"/></marker>
  </defs>
  <rect width="1600" height="560" rx="32" fill="url(#bg)"/>
  <circle cx="1490" cy="-10" r="210" fill="#f3a43b" opacity=".14"/><circle cx="-40" cy="580" r="230" fill="#7dd3c7" opacity=".12"/>
  <text x="70" y="78" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">PUBLIC REPRODUCIBILITY PIPELINE</text>
  <text x="70" y="117" fill="#b8d5df" font-family="Segoe UI,Arial,sans-serif" font-size="19">Wheelchair IMU angular profiling · protocol → signal → phase-aware outputs</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(70,180)"><rect width="260" height="210" rx="20" fill="url(#card)" stroke="#7dd3c7" stroke-width="2"/><circle cx="42" cy="43" r="24" fill="#7dd3c7"/><text x="42" y="51" text-anchor="middle" fill="#071827" font-size="22" font-weight="700">01</text><text x="30" y="95" fill="#ffffff" font-size="22" font-weight="700">Acquire</text><text x="30" y="127" fill="#c8e4ea" font-size="16">Frontal + sagittal video</text><text x="30" y="153" fill="#c8e4ea" font-size="16">iSen inertial exports</text><text x="30" y="179" fill="#f6c77e" font-size="14">private source media stays local</text></g>
    <g transform="translate(390,180)"><rect width="260" height="210" rx="20" fill="url(#card)" stroke="#7dd3c7" stroke-width="2"/><circle cx="42" cy="43" r="24" fill="#7dd3c7"/><text x="42" y="51" text-anchor="middle" fill="#071827" font-size="22" font-weight="700">02</text><text x="30" y="95" fill="#ffffff" font-size="22" font-weight="700">Condition</text><text x="30" y="127" fill="#c8e4ea" font-size="16">time checks + sync</text><text x="30" y="153" fill="#c8e4ea" font-size="16">Butterworth low-pass</text><text x="30" y="179" fill="#f6c77e" font-size="14">6 Hz · order 4 · zero phase</text></g>
    <g transform="translate(710,180)"><rect width="260" height="210" rx="20" fill="url(#card)" stroke="#7dd3c7" stroke-width="2"/><circle cx="42" cy="43" r="24" fill="#7dd3c7"/><text x="42" y="51" text-anchor="middle" fill="#071827" font-size="22" font-weight="700">03</text><text x="30" y="95" fill="#ffffff" font-size="22" font-weight="700">Describe</text><text x="30" y="127" fill="#c8e4ea" font-size="16">device-defined angle</text><text x="30" y="153" fill="#c8e4ea" font-size="16">velocity + acceleration</text><text x="30" y="179" fill="#f6c77e" font-size="14">explicit neutral reference</text></g>
    <g transform="translate(1030,180)"><rect width="260" height="210" rx="20" fill="url(#card)" stroke="#7dd3c7" stroke-width="2"/><circle cx="42" cy="43" r="24" fill="#7dd3c7"/><text x="42" y="51" text-anchor="middle" fill="#071827" font-size="22" font-weight="700">04</text><text x="30" y="95" fill="#ffffff" font-size="22" font-weight="700">Normalize</text><text x="30" y="127" fill="#c8e4ea" font-size="16">propulsion / recovery</text><text x="30" y="153" fill="#c8e4ea" font-size="16">100 points per phase</text><text x="30" y="179" fill="#f6c77e" font-size="14">interpolation is auditable</text></g>
    <g transform="translate(1350,180)"><rect width="180" height="210" rx="20" fill="#f3a43b"/><circle cx="42" cy="43" r="24" fill="#071827"/><text x="42" y="51" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">05</text><text x="25" y="95" fill="#071827" font-size="22" font-weight="700">Report</text><text x="25" y="127" fill="#071827" font-size="16">metrics</text><text x="25" y="153" fill="#071827" font-size="16">CSV + JSON</text><text x="25" y="179" fill="#071827" font-size="14">manifest</text></g>
  </g>
  <g stroke="#7dd3c7" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M335 285 H380"/><path d="M655 285 H700"/><path d="M975 285 H1020"/><path d="M1295 285 H1340"/></g>
  <text x="800" y="485" text-anchor="middle" fill="#b8d5df" font-family="Segoe UI,Arial,sans-serif" font-size="18">No raw video · no consent forms · no local paths · no clinical software claim</text>
</svg>
